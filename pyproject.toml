[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gensokyoai"
version = "2.0.0.dev0"
description = "幻想乡 AI 角色扮演引擎 v2 —— 房间即中心"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "ayafileio>=1.16.0",
    "loguru>=0.7",
    "msgspec>=0.18",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["gensokyoai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["gensokyoai"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF"]
# 全角标点歧义检查；正文用中文标点，这三条是纯噪音
ignore = ["RUF001", "RUF002", "RUF003"]
