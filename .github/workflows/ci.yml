name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: lint / tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip uv
          python -m uv pip install --system -e . pytest pytest-asyncio ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

      # 打包回归：wheel 能 build、装完模块入口能跑
      - name: Build wheel and verify module entry
        run: |
          python -m uv pip install --system build
          python -m build --wheel
          pip install --force-reinstall --no-deps dist/*.whl
          python -m gensokyoai --help
