name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: lint / types / tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy gensokyoai

      - name: Pytest
        run: pytest -q

      # 打包回归：wheel 是否含入口点与自带资源、装完是否真能跑
      - name: Build wheel
        run: python -m build --wheel

      - name: Verify packaged entry points and bundled resources
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          gensokyoai --help
          gensokyoai-ws --help
          cd "${{ runner.temp }}"
          python -c "from gensokyoai.app import DEFAULT_CONFIG, resolve_resource; p = resolve_resource(DEFAULT_CONFIG); print('bundled config:', p); assert '_resources' in str(p), p"
