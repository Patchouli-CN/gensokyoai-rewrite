# 配置示例 —— 复制成 settings.yaml 再改（settings.yaml 不进仓库）。
#
# 这份文件必须覆盖 gensokyoai.settings.Settings 的**全部字段**：
# tests/test_settings_example.py 会逐字段核对，加字段忘了更新这里会红。
#
# 现在的分工：
#   config/llm/*.yaml   模型、供应商、任务、价格（唯一来源）
#   settings.yaml       计费覆盖 + 前缀缓存 + 静息整理
#
# model 段只给回退路径用（config/llm 不存在时才会读它），平时不用写。

billing:
  # 价格跟着适配器走（openai / anthropic 带美元价，deepseek 带人民币峰谷价）。
  # 想覆盖就在这里写，全 0 = 用适配器自带的。
  price:
    currency: CNY
    input: 0
    output: 0
    cached: 0
    # peak:                # 给了高峰价就启用峰谷（北京时间的工作时段）
    #   input: 0
    #   output: 0
    #   cached: 0
    # peak_hours: ["9-12", "14-18"]
    # peak_weekdays: [1, 2, 3, 4, 5]
    # holidays: ["2026-01-01"]

  # 滚动窗口额度（订阅制的墙）。token 与 cost 都为 0 的条目会被忽略。
  quotas: []
  # quotas:
  #   - span: 5h
  #     tokens: 200000
  #   - span: 7d
  #     tokens: 1000000

  # 用量流水。空 = 用 data/usage.jsonl
  usage: ""

# 前缀缓存与压缩
prompt:
  cache: true           # false = 每轮重拼、不压缩（调试/回退用）
  fixed: 64             # 对齐粒度（token），云端前缀缓存按 64 对齐
  compact_ratio: 0.75   # 上下文用到多少才压缩（1.0 = 塞满才压）
  compact_keep: 8       # 压缩时留最近几条历史不压

# 静息整理
idle:
  sleep_s: 1800         # 房间静默多久算睡着（秒）
  patrol_s: 60          # 巡检间隔（秒）

# 只在没有 config/llm 时才用（回退路径）
model:
  provider: openai
  base_url: http://127.0.0.1:8080/v1
  name: ""
  api_key: ""
  think: false
  timeout: 120
  extra: {}
  capabilities: [text, image]
  auto_detect: true
  vision: ""
