# 嗓音层配置 —— GPT-SoVITS api_v2 服务（config/voice/{服务名}.yaml 约定）
#
# 服务由部署方自己拉起（与 llama-server 同一原则：框架只连不拉）：
#   cd G:\GPT-SOVITS\GPT-SoVITS-v2pro-20261006
#   runtime\python.exe api_v2.py -a 127.0.0.1 -p 9880
#
# characters 的键必须等于角色卡的 name 字段（加载哪个角色就用哪条声线）。
# 权重路径相对 GSVI 服务根目录；ref_audio 用本机绝对路径（服务同机部署时）。

enabled: true
base_url: "http://127.0.0.1:9880"
timeout: 120.0
text_lang: "zh"            # 角色回复的语言（合成文本语言；改日语声线表演时换 ja + 前置翻译）
speed_factor: 1.0

characters:
  西行寺幽幽子:
    gpt_weights: "models/GPT_weights_v4/东方归言录_西行寺幽幽子_3-e15.ckpt"
    sovits_weights: "models/SoVITS_weights_v4/东方归言录_西行寺幽幽子_3_e5_s420_l32.pth"
    ref_audio: "D:/python_play/gensokyoai-rewrite/config/voice/refs/yuyuko_ref.wav"
    prompt_text: "さて、落ち着いたら進むべき道へ戻りましょうか"
    prompt_lang: "ja"
