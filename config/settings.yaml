# GensokyoAI 配置文件
#
# 注意：键名必须与 GensokyoConfig 的字段名一致（default_model / brain / responder /
# ooc / memorizer / resource / gate / ooc_judge / style）。此前这里写的是 `model:`，
# 与字段名 `default_model` 不匹配，msgspec 会静默忽略未知键 —— 等于什么都没配。
default_model:
  provider: "llama_cpp"
  base_url: "http://127.0.0.1:8080/v1"
  model_name: "qwen"
  think: false
  streaming: true
  context_window: 32768
  tool_timeout: 10.0
  tool_max_result_chars: 2000

brain:
  provider: "llama_cpp"
  base_url: "http://127.0.0.1:8080/v1"
  model_name: "qwen"
  think: false

responder:
  provider: "llama_cpp"
  base_url: "http://127.0.0.1:8080/v1"
  model_name: "qwen"
  think: false

# 资源闸门：保护本地单模型（串行稀缺资源）
resource:
  enabled: true
  max_concurrent: 1
  rpm: 0
  concurrency: 1
  calls_per_day: 0
  tokens_per_day: 0
  ingress_rate: 0.0
  ingress_burst: 0

# 发言门控 + 模型化档位路由（jev 式 System-1 层）：
# 一次裁判调用同时回答「该不该接话」和「该想多深」（needs_deep 分数 -> 档位）。
# 裁判挂了自动退化：不接的回合回落「点名才回」，档位回落规则 route()。
gate:
  enabled: true
  judge: "local"          # local=主模型当裁判 | typesafe=真 jev（需 pip install '.[jev]'）| none=纯规则
  group_threshold: 0.8    # 群里没人点名时，裁判 should_reply 达到该值才接话（调低更活跃）。
                          # 实测 local 裁判对无人点名闲聊打 0.6~0.8，0.6 等于见话就接；
                          # 复读链交给将来的平台侧 eyes 插件（同内容滑窗计数+冷却），core 不内置
  search_threshold: 0.1
  timeout_ms: 60000       # 本地模型单次要 10~25s；用真 jev（云端快）可调回 5000
  route_by_model: true    # 档位由裁判的 needs_deep 说了算（规则路由做兜底）
  deep_cuts: [0.3, 0.6, 0.85]   # 进 MID / HIGH / MAX 的切点

# jev 化出戏审查（core/brain/ooc_judge.py）：一次裁判调用四问概率 +
# 应用层接受规则。state 带诱发消息（旧 audit 看不到，冷面接梗会被误判）；
# side_chain=异步记账不阻塞（默认）；blocking=最终缓冲区审查通过才放行。
# 概率未校准过——阈值先用实录回放测误报率，再决定要不要上 blocking。
ooc_judge:
  enabled: true
  mode: "side_chain"
  max_new_tokens: 192     # local 裁判输出预算（四个概率 + 题名）
  temperature: 0.2
  timeout_ms: 60000       # 本地模型单次 10~25s
  unsafe_threshold: 0.5       # contains_unsafe 超线一票否决（泄提示词/隐私/危险引导）
  instruction_threshold: 0.6  # follows_embedded_instruction 超线 = 「大概率在服从注入」
  voice_threshold: 0.6        # breaks_voice 超线 = 「大概率丢了角色口吻」
  plausible_low: 0.35         # plausible_as_character 低于它 = 判 revise（不是角色会说出口的话）
  plausible_high: 0.6         # 模糊带（0.35~0.6）= flag 黄色预警，记录不阻断

# 文风防复读（治小模型重复自己的模板/口头禅；20 轮实录照出 88% 骨架复用）：
# dedup_endings——同一收尾近期用够次数就剥掉（ported qqbot「不复读结尾」规则）；
# similarity_retry——相邻轮相似度过阈值触发一次纠偏重写（0 关闭）。
style:
  dedup_endings: true
  ending_window: 6
  similarity_retry: 0.75

# 记忆语义检索（embedding）：开启后长期记忆按余弦相似度检索（向量单独存
# vectors.msgpack，不进 long_memory.json）；关闭退回子串匹配。
# 端点 = 任何 OpenAI 兼容 /embeddings 服务。注意 llama-server 的 --embedding
# 实例不能同时服务 chat——本地需另起一个实例（端口与主模型分开）。
embedding:
  enabled: true
  base_url: "http://127.0.0.1:8081/v1"
  model: "bge-small-zh"
  timeout: 30.0
  min_score: 0.35    # 语义检索相似度下限：实测相关命中 ~0.37、噪声 ~0.30，取中间

# 联网工具（web_search / fetch_url）资料策略：可靠站优先、泛搜索兜底。
# 站点表会拼进脑内【可用工具】块，告诉模型查领域知识先 fetch_url 抓这些站
# （thbwiki 支持 MediaWiki API：api.php?action=query&list=search 可直接搜词条），
# 查不到再 web_search。注意 DDG 的 safesearch 对中文垃圾站过滤力弱。
search:
  cache_ttl_s: 1800.0    # 知识缓存 L1（会话内精确缓存）秒数；L2 长期记忆永久
  knowledge_sites:
    - site: thbwiki.cc
      desc: 东方 Project 中文维基——角色设定、符卡、剧情考据都可查；支持 MediaWiki API（api.php?action=query&list=search 搜词条）
